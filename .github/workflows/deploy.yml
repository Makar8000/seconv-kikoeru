name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Compile
        run: bun run build

      - name: Create Artifact
        run: |
          mkdir release
          mkdir artifact
          mkdir artifact/queue
          New-Item artifact\queue\.place-files-to-translate-here
          Copy-Item -Path bin\seconv-kikoeru\* -Destination artifact -Recurse
          Compress-Archive -Path artifact\* -DestinationPath release\seconv-kikoeru.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: seconv-kikoeru
          path: artifact/
          include-hidden-files: true

      - name: Check version
        id: version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "package.json has no version" }
          $tag = "v$version"
          git rev-parse -q --verify "refs/tags/$tag" | Out-Null
          $due = ($LASTEXITCODE -ne 0) -and ($env:GITHUB_EVENT_NAME -eq "push")
          $global:LASTEXITCODE = 0
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$($due.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Release notes
        if: steps.version.outputs.release == 'true'
        run: |
          # List every commit since the last version tag (or all of them for the first release)
          $previous = git tag --list "v*" --sort=-v:refname | Select-Object -First 1
          $range = if ($previous) { "$previous..HEAD" } else { "HEAD" }
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit"
          git log $range --no-merges --pretty=format:"- %s ([%h]($url/%H))" | Set-Content release-notes.md

      - name: Create Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/seconv-kikoeru.zip
          body_path: release-notes.md
          prerelease: false
