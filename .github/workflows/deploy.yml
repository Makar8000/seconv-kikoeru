name: Deploy
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: windows-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Compile Executable
        run: bun run build

      - name: Create Artifact
        run: |
          mkdir release
          mkdir artifact
          mkdir artifact/queue
          New-Item artifact\queue\.place-files-to-translate-here
          Copy-Item -Path bin\seconv-kikoeru\* -Destination artifact -Recurse
          Compress-Archive -Path artifact\* -DestinationPath release\seconv-kikoeru.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: seconv-kikoeru
          path: artifact/
          include-hidden-files: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/seconv-kikoeru.zip
          prerelease: false
