<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>seconv-kikoeru</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header>
      <h1>seconv-kikoeru</h1>
      <span class="pill" id="pill">Idle</span>
    </header>

    <div class="notice" id="seconvNotice" hidden>
      <div class="notice-text">
        <strong>seconv was not found</strong>
        <span>
          Download it automatically, or get it from
          <a href="https://github.com/SubtitleEdit/subtitleedit/releases" target="_blank" rel="noopener">github.com/SubtitleEdit/subtitleedit/releases</a>
          and put it in <code>lib/seconv/</code> or your PATH.
        </span>
      </div>
      <button type="button" id="installSeconv" class="primary">Download latest pre-release</button>
    </div>

    <section class="card">
      <h2>SeConv</h2>
      <div class="fields">
        <div class="field">
          <label for="translateEngine">Engine</label>
          <select id="translateEngine" data-key="translateEngine"></select>
        </div>
        <div class="field">
          <label for="translateModel">Model</label>
          <input id="translateModel" data-key="model" data-engine placeholder="First available" spellcheck="false">
        </div>
        <div class="field full">
          <label for="translateUrl">Server URL</label>
          <input id="translateUrl" data-key="url" data-engine spellcheck="false">
        </div>
        <div class="field">
          <label for="translateFrom">Translate from</label>
          <select id="translateFrom" data-key="translateFrom"></select>
        </div>
        <div class="field">
          <label for="translateTo">Translate to</label>
          <select id="translateTo" data-key="translateTo"></select>
        </div>
        <div class="field full">
          <label for="additionalArgs-input">Additional arguments</label>
          <div class="chips" data-list="additionalArgs" data-engine data-placeholder="e.g. --translate-prompt:my.prompt, then press Enter"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Queue</h2>
      <div class="fields">
        <div class="field full">
          <label for="rjPath">Queue directory</label>
          <input id="rjPath" data-key="rjPath" spellcheck="false">
        </div>
        <div class="field full">
          <label for="subtitleExtensions-input">File extensions</label>
          <div class="chips" data-list="subtitleExtensions" data-placeholder="e.g. srt, then press Enter"></div>
        </div>
      </div>
    </section>

    <div class="runbar">
      <button id="start" class="primary">Start translation</button>
      <button id="stop" class="danger" hidden>Stop</button>
      <div class="progress" id="progress">
        <div id="bar"></div>
      </div>
      <span id="status">Idle</span>
    </div>

    <section class="card console">
      <div class="console-head">
        <h2>Console</h2>
        <button type="button" id="clear" class="ghost">Clear</button>
      </div>
      <div id="console" role="log"></div>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
